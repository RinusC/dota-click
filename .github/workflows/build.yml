name: Build Windows app

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.11.1

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Download speech model
        timeout-minutes: 15
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 --max-time 600 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          Expand-Archive model.zip -DestinationPath .
          Rename-Item vosk-model-small-ru-0.22 model

      - name: Check phrases against model vocabulary
        run: python -m dota_voice --check

      - name: Build exe
        run: >-
          pyinstaller --noconfirm --windowed --name DotaVoice --collect-all vosk
          --add-data "settings.toml;." --add-data "profiles;profiles" app.py

      - name: Assemble folder
        shell: pwsh
        run: |
          Copy-Item settings.toml dist/DotaVoice/
          Copy-Item profiles dist/DotaVoice/profiles -Recurse
          Copy-Item model dist/DotaVoice/model -Recurse
          Copy-Item README.md dist/DotaVoice/

      - name: Smoke test exe
        shell: pwsh
        run: |
          $p = Start-Process dist/DotaVoice/DotaVoice.exe -ArgumentList '--check' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "DotaVoice.exe --check hung"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "DotaVoice.exe --check exit code $($p.ExitCode)"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: DotaVoice-windows
          path: dist/DotaVoice

  voice-e2e:
    # Синтезированная речь через настоящую модель: проверка распознавания и задержки.
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install espeak-ng and vosk
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q espeak-ng
          pip install vosk

      - name: Download speech model
        timeout-minutes: 15
        run: |
          curl -L --fail --retry 3 --max-time 600 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q model.zip
          mv vosk-model-small-ru-0.22 model

      - name: Speak phrases and measure reaction time
        run: python tests/e2e_voice.py
