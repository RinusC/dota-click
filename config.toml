# Настройки Dota Voice.
# Каждая команда — это ОДНА фраза → ОДНО нажатие клавиши.
# Последовательности нажатий (макросы) специально не поддерживаются.
#
# Клавиши указаны для стандартной раскладки Dota 2. Если вы меняли
# горячие клавиши в игре — поменяйте key ниже.
# Допустимые клавиши: a-z, 0-9, f1-f12, space, tab, esc, enter, alt, ctrl,
# shift, стрелки (up/down/left/right) и т.п.; можно с модификатором: "ctrl+q".

[settings]
model_path = "model"            # папка с моделью Vosk
device = ""                     # микрофон: "" — по умолчанию, или номер/название из --list-devices
only_when_dota_focused = true   # нажимать клавиши, только если окно Dota 2 активно (Windows)
key_hold_ms = 40                # сколько держать клавишу нажатой, мс
use_grammar = true              # распознавать только фразы из этого файла (точнее и быстрее)
show_unrecognized = true        # показывать в консоли нераспознанные фразы

[control]
pause = ["голос пауза", "выключить голос"]
resume = ["голос продолжить", "включить голос"]

# ---------- Способности ----------

[[command]]
name = "Первая способность"
key = "q"
phrases = ["первый скилл", "первая способность", "первый навык"]

[[command]]
name = "Вторая способность"
key = "w"
phrases = ["второй скилл", "вторая способность", "второй навык"]

[[command]]
name = "Третья способность"
key = "e"
phrases = ["третий скилл", "третья способность", "третий навык"]

[[command]]
name = "Четвёртая способность"
key = "d"
phrases = ["четвертый скилл", "четвертая способность", "четвертый навык"]

[[command]]
name = "Пятая способность"
key = "f"
phrases = ["пятый скилл", "пятая способность", "пятый навык"]

[[command]]
name = "Ульта"
key = "r"
phrases = ["ульта", "ульту", "ульт", "ультимейт", "ультимейта"]

# ---------- Прокачка (Ctrl + клавиша способности) ----------

