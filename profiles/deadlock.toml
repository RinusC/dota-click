# Профиль Deadlock для Dota Voice.
# Каждая команда — это ОДНА фраза → ОДНО нажатие клавиши.
# Последовательности нажатий (макросы) специально не поддерживаются.
#
# Клавиши — стандартная раскладка Deadlock: способности 1-4 (4 — ульта),
# предметы Z X C V, ближний удар Q, парирование F, перезарядка R.
# Если вы меняли управление в игре (Настройки → Управление) — поменяйте key ниже.
# Удержание клавиш не поддерживается: «удар» — это обычный (лёгкий) удар.

[game]
name = "Deadlock"
window_title = "Deadlock"       # по этому заголовку окна программа понимает, что игра активна

[control]
pause = ["голос пауза", "выключить голос"]
resume = ["голос продолжить", "включить голос"]

# ---------- Способности ----------

[[command]]
name = "Первая способность"
key = "1"
phrases = ["первый скилл", "первая способность", "первый навык"]

[[command]]
name = "Вторая способность"
key = "2"
phrases = ["второй скилл", "вторая способность", "второй навык"]

[[command]]
name = "Третья способность"
key = "3"
phrases = ["третий скилл", "третья способность", "третий навык"]

[[command]]
name = "Ульта"
key = "4"
phrases = ["ульта", "ульту", "ульт", "ультимейт", "ультимейта", "четвертый скилл", "четвертая способность"]

# ---------- Предметы ----------

[[command]]
name = "Предмет 1"
key = "z"
phrases = ["один", "первый предмет"]

[[command]]
name = "Предмет 2"
key = "x"
phrases = ["два", "второй предмет"]

[[command]]
name = "Предмет 3"
key = "c"
phrases = ["три", "третий предмет"]

[[command]]
name = "Предмет 4"
key = "v"
phrases = ["четыре", "четвертый предмет"]

# ---------- Действия ----------

[[command]]
name = "Ближний удар"
key = "q"
phrases = ["удар", "бей", "ближний удар"]

[[command]]
name = "Парирование"
key = "f"
phrases = ["парирование", "парри", "блок"]

[[command]]
name = "Перезарядка"
key = "r"
phrases = ["перезарядка", "перезарядить"]

[[command]]
name = "Прыжок"
key = "space"
phrases = ["прыжок", "прыгай"]
