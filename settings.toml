# Общие настройки Dota Voice (для всех игр).
# Профили игр с командами лежат в папке profiles/.

[settings]
model_path = "model"            # папка с моделью Vosk
device = ""                     # микрофон: "" — по умолчанию (в окне программы выбирается списком)
only_when_game_focused = true   # нажимать клавиши, только если окно игры активно (Windows)
key_hold_ms = 40                # сколько держать клавишу нажатой, мс
use_grammar = true              # распознавать только фразы из профиля (точнее и быстрее)
show_unrecognized = true        # показывать нераспознанные фразы
