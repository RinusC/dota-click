  if (UI.ad) h += `<div class="ad"><div><div class="tv">📺</div><h3>${esc(tr("ad_placeholder"))}</h3><div>${esc(tr(UI.ad.rewarded ? "ad_closing_in" : "ad_interstitial_in", UI.ad.left))}</div>${UI.ad.rewarded ? "" : `<div class="muted" style="margin-top:8px">${esc(tr("ad_remove_hint"))}</div>`}</div></div>`;
  if (UI.tooltip) h += `<div class="tooltip" data-act="tipclose">${esc(UI.tooltip)}</div>`;
  if (UI.toast) h += `<div class="toast">${esc(UI.toast)}</div>`;
  if (UI.banner) h += `<div class="banner">${esc(UI.banner)}</div>`;
  return h;
}

// Minimal DOM patcher: keeps existing elements so taps and long-presses survive 10 Hz re-renders.
function patch(parent, html) {
  const tpl = document.createElement("template"); tpl.innerHTML = html; patchChildren(parent, tpl.content);
}
function patchChildren(a, b) {
  const an = a.childNodes, bn = Array.from(b.childNodes);
  for (let i = 0; i < bn.length; i++) { const o = an[i], n = bn[i]; if (!o) a.appendChild(n.cloneNode(true)); else patchNode(o, n); }
  while (an.length > bn.length) a.removeChild(a.lastChild);
}
function patchNode(o, n) {
  if (o.nodeType !== n.nodeType || o.nodeName !== n.nodeName || (o.dataset && n.dataset && o.dataset.lane !== n.dataset.lane)) { o.replaceWith(n.cloneNode(true)); return; }
  if (o.nodeType === 3) { if (o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue; return; }
  if (o.nodeType !== 1) return;
  const keepStyle = o.hasAttribute("data-bar");
  for (const at of Array.from(o.attributes)) if (!n.hasAttribute(at.name) && !(keepStyle && at.name === "style")) o.removeAttribute(at.name);
  for (const at of Array.from(n.attributes)) if (o.getAttribute(at.name) !== at.value) o.setAttribute(at.name, at.value);
  if (o.tagName === "INPUT" && o.checked !== n.hasAttribute("checked")) o.checked = n.hasAttribute("checked");
  if (o.tagName === "BUTTON") o.disabled = n.hasAttribute("disabled");
  if (o.tagName !== "CANVAS") patchChildren(o, n);
}

const $top = document.getElementById("top"), $screen = document.getElementById("screen"), $nav = document.getElementById("nav"), $layers = document.getElementById("layers");
const SCREENS = { lanes: scrLanes, heroes: scrHeroes, shop: scrShop, battle: scrBattle, rebirth: scrRebirth, talents: scrTalents };
function render() {
  LANG = E.s.settings.language; document.documentElement.lang = LANG;
  patch($top, renderTop()); patch($nav, renderNav()); patch($screen, SCREENS[UI.tab]()); patch($layers, renderLayers());
}

// ---------------------------------------------------------------- events → floaters & sounds
function floater(anchor, text, color) {
  const el = document.querySelector(`[data-anchor="${anchor}"]`); if (!el) return; const r = el.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
  const f = document.createElement("div"); f.className = "floater"; f.textContent = text; f.style.color = color;
  f.style.left = (r.left + r.width * (0.35 + Math.random() * 0.4)) + "px"; f.style.top = (r.top + r.height * 0.45) + "px";
  document.body.appendChild(f); setTimeout(() => f.remove(), 1250);
}
function showBanner(t) { UI.banner = t; clearTimeout(UI.bannerTimer); UI.bannerTimer = setTimeout(() => { UI.banner = null; render(); }, 2200); Audio_.play("big", 500); }
function showToast(t) { UI.toast = t; clearTimeout(UI.toastTimer); UI.toastTimer = setTimeout(() => { UI.toast = null; render(); }, 3500); }
function showTip(t) { UI.tooltip = t; clearTimeout(UI.tooltipTimer); UI.tooltipTimer = setTimeout(() => { UI.tooltip = null; render(); }, 4000); render(); }
function drain() {
  for (const e of E.events.splice(0)) {
    if (e.t === "lane") { if (UI.tab === "lanes") floater("lane" + e.lane, "+" + fmt(e.gold), "var(--gold)"); Audio_.play("gold", 250); }
    else if (e.t === "kill") { if (UI.tab === "battle") floater("battle", "+" + fmt(e.gold), "var(--gold)"); Audio_.play("kill", 200); }
    else if (e.t === "gold") floater("top", "+" + fmt(e.gold), "var(--gold)");
    else if (e.t === "cast") Audio_.play("cast", 150);
    else if (e.t === "aegis") showBanner(tr("aegis_gained"));
    else if (e.t === "ancient") showBanner(tr("ancient_down"));
  }
}

// ---------------------------------------------------------------- ads (stub)
function showAd(rewarded, onDone) {
  if (UI.ad) return; UI.ad = { rewarded, left: rewarded ? 5 : 3 }; render();
  const iv = setInterval(() => { UI.ad.left--; if (UI.ad.left <= 0) { clearInterval(iv); UI.ad = null; onDone && onDone(); } render(); }, 1000);
}

// ---------------------------------------------------------------- input
const ACTIONS = {
  tab: id => { UI.tab = id; $screen.scrollTop = 0; }, settings: () => { UI.settings = true; UI.confirmReset = false; },
  lane: i => E.upgradeLane(+i), lvl: i => E.levelUp(+i), hire: i => E.hire(+i), cast: i => E.cast(+i), buy: id => E.buyItem(id),
  equip: i => { UI.equipFor = +i; }, unequip: (i, j) => E.unequip(+i, +j), equipclose: () => { UI.equipFor = null; },
  equipitem: id => { E.equip(UI.equipFor, id); const s = E.s.heroes[UI.equipFor]; if (!s.items.includes(null) || !E.s.inventory.length) UI.equipFor = null; return true; },
  tap: () => { const d = E.tap(); floater("battle", "-" + fmt(d), "var(--red-hi)"); return true; },
  talent: id => E.buyTalent(id),
  rebirth: () => { UI.confirmRebirth = true; }, rebirthno: () => { UI.confirmRebirth = false; },
  rebirthyes: () => { UI.confirmRebirth = false; const g = E.rebirth(); if (g > 0) { showBanner("+" + g + " MMR"); saveNow(); } },
  adx2: () => showAd(true, () => E.goldX2()),
  adfarm: () => { if (E.farmReady(Date.now())) showAd(true, () => { const r = E.claimFarm(Date.now()); if (r) showToast(tr("farm_reward", fmt(r.gold), r.kills)); }); },
  offok: () => { UI.offline = null; }, offdouble: () => { const r = UI.offline; UI.offline = null; showAd(true, () => E.grantGold(r.gold)); },
  closesettings: () => { UI.settings = false; }, lang: l => { E.s.settings.language = l; saveNow(); },
  sound: () => { E.s.settings.sound = !E.s.settings.sound; }, music: () => { E.s.settings.music = !E.s.settings.music; Audio_.music(E.s.settings.music); },
  noads: () => { E.s.settings.noAds = true; saveNow(); }, save: () => { saveNow(); showToast(tr("saved")); },
  reset: () => { UI.confirmReset = true; }, resetno: () => { UI.confirmReset = false; },
  resetyes: () => { const st = E.s.settings; E.s = newState(); E.s.settings = st; E.log = []; E.events = []; UI.settings = false; UI.confirmReset = false; saveNow(); },
  "test-offline": () => { UI.settings = false; E.s.lastSaveMillis = Date.now() - 2 * 3600 * 1000; const r = E.applyOffline(Date.now()); if (r) UI.offline = r; saveNow(); },
  "test-gold": () => { E.grantGold(Math.max(1000, E.gps() * 100)); return true; },
  tipclose: () => { UI.tooltip = null; },
};
let press = null, suppressClick = false;
document.addEventListener("pointerdown", e => {
  Audio_.ensure(); const t = e.target.closest("[data-tip]"); if (!t) return;
  press = { el: t, x: e.clientX, y: e.clientY, timer: setTimeout(() => { suppressClick = true; showTip(t.dataset.tip); if (navigator.vibrate) try { navigator.vibrate(15); } catch (_) {} }, 500) };
});
const cancelPress = () => { if (press) { clearTimeout(press.timer); press = null; } };
document.addEventListener("pointerup", cancelPress); document.addEventListener("pointercancel", cancelPress);
document.addEventListener("pointermove", e => { if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) cancelPress(); });
document.addEventListener("contextmenu", e => { if (e.target.closest("[data-tip]")) e.preventDefault(); });
document.addEventListener("click", e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); return; }
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const [name, ...args] = el.dataset.act.split(":");
  if (name === "closesettings-bg") { if (e.target === el) { UI.settings = false; render(); } return; }
  const fn = ACTIONS[name]; if (!fn) return;
  const ok = fn(...args); if (ok !== false) Audio_.play("click", 30); drain(); render();
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".card[data-act]")) { e.preventDefault(); e.target.click(); } });

// ---------------------------------------------------------------- loops
function frame() {
  const since = (performance.now() - UI.lastTick) / 1000;
  document.querySelectorAll("[data-bar]").forEach(el => {
    const [k, i] = el.dataset.bar.split(":"); let f = 0;
    if (k === "lane") { const l = E.s.lanes[+i]; f = (l.progress + since / E.waveInterval()) % 1; }
    else if (k === "hp") { const b = E.s.battle; f = (b.enemyHp - E.teamDps() * since) / B.enemyHp(b.enemyIndex); }
    else if (k === "cd") { const h = E.s.heroes[+i]; const m = E.abilityCd(h); f = m > 0 ? 1 - (h.cooldown - since) / m : 1; }
    el.style.width = (Math.max(0, Math.min(1, f)) * 100).toFixed(2) + "%";
  });
  document.querySelectorAll("canvas[data-lane]").forEach(cv => drawLane(cv, (E.s.lanes[+cv.dataset.lane].progress + since / E.waveInterval()) % 1));
  requestAnimationFrame(frame);
}
function drawLane(cv, p) {
  const c = cv.getContext("2d"), w = cv.width, h = cv.height, mid = h / 2, u = h / 64; c.clearRect(0, 0, w, h);
  c.fillStyle = "#2b2219"; c.fillRect(0, mid - 6 * u, w, 12 * u);
  c.fillStyle = "#5dbb63"; c.fillRect(4 * u, mid - 14 * u, 12 * u, 28 * u); c.fillStyle = "#b8321f"; c.fillRect(w - 16 * u, mid - 14 * u, 12 * u, 28 * u);
  const hx = w * 0.32, bob = Math.sin(performance.now() / 150) * 2 * u; c.fillStyle = "#e8b64c"; c.beginPath(); c.arc(hx, mid + bob, 9 * u, 0, 7); c.fill();
  const front = w * (0.92 - 0.52 * p), alpha = p > 0.9 ? 1 - (p - 0.9) * 10 : 1;
  if (p > 0.6) { c.strokeStyle = "rgba(232,182,76,.7)"; c.lineWidth = 2 * u; c.beginPath(); c.moveTo(hx, mid); c.lineTo(front, mid); c.stroke(); }
  c.fillStyle = `rgba(255,90,61,${Math.max(0, Math.min(1, alpha))})`;
  for (let k = 0; k < B.CREEPS_PER_WAVE; k++) { c.beginPath(); c.arc(front + k * 12 * u, mid + (k % 2 ? 5 : -5) * u, 5 * u, 0, 7); c.fill(); }
}
let acc = 0, lastReal = performance.now(), autosave = 0;
function loop() {
  const now = performance.now(); acc = Math.min(5, acc + (now - lastReal) / 1000); lastReal = now; let ticks = 0;
  while (acc >= 0.1) { E.tick(0.1); acc -= 0.1; ticks++; }
  if (ticks) {
    UI.lastTick = performance.now(); drain(); autosave += ticks * 0.1;
    if (autosave >= 15) { autosave = 0; saveNow(); }
    if (E.s.secondsSinceInterstitial >= B.INTERSTITIAL_INTERVAL_SECONDS) {
      if (E.s.settings.noAds) E.s.secondsSinceInterstitial = 0;
      else if (!UI.ad && !UI.offline) { E.s.secondsSinceInterstitial = 0; showAd(false); }
    }
    render();
  }
}
function resume() { const r = E.applyOffline(Date.now()); if (r && r.awaySeconds >= 60) UI.offline = r; lastReal = performance.now(); acc = 0; render(); }
document.addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); else resume(); });
window.addEventListener("pagehide", saveNow);

// ---------------------------------------------------------------- boot
E.s = loadState() || newState(); E.normalize(); LANG = E.s.settings.language;
resume();
setInterval(loop, 100);
requestAnimationFrame(frame);
</script>
